plugins { id 'com.android.application' }

android {
    namespace 'app.mirrorcall.android'
    compileSdk 36
    defaultConfig {
        applicationId 'app.mirrorcall.android'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '2.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    sourceSets { main { assets.srcDirs = ['../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation 'io.github.webrtc-sdk:android:150.7871.04' }
