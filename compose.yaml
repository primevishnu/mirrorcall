services:
  signaling:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["3000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [signaling]
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_DOMAIN: ${TURN_DOMAIN}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec turnserver --no-cli --no-tls --no-dtls --fingerprint --use-auth-secret --static-auth-secret="$$TURN_SHARED_SECRET" --realm="$$TURN_DOMAIN" --external-ip="$$TURN_EXTERNAL_IP" --listening-port=3478 --min-port=49160 --max-port=49200 --no-multicast-peers --no-tcp-relay --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255 --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.0.0.0-192.0.0.255 --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=198.18.0.0-198.19.255.255 --denied-peer-ip=::1 --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff --user-quota=4 --total-quota=8 --log-file=stdout --simple-log --no-software-attribute'
volumes:
  caddy_data:
  caddy_config:
