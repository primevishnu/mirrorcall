# Cloudflare Workers deployment (free plan). See README.md → "Put the server online".
name = "mirrorcall"
main = "worker/index.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The web UI is bundled inside the Android app; serving it here lets you test in a browser.
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Rooms"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Rooms"]

# Secrets (never put them here): SERVER_ACCESS_KEY, TURN_KEY_ID, TURN_KEY_API_TOKEN
[vars]
ALLOWED_ORIGINS = "https://appassets.androidplatform.net"
MAX_ROOMS = "1"
TURN_TTL_SECONDS = "86400"
